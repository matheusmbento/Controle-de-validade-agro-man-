        <div className="scr" style={{ flex: 1, paddingRight: 0, minHeight: 0, overflowY: 'auto', overflowX: 'hidden', display: 'flex', flexDirection: 'column', gap: 0 }}>
        {top10.length === 0 && <div className="empty"><div className="empty-icon">🗒️</div><p>Nenhum produto cadastrado.</p></div>}
        {top10.map((item, i) => {
          const d    = diffDays(item.expiry);
          const st   = statusOf(item.expiry, item.category);
          
          let col = 'var(--accent-green)';
          if (d < 0) col = '#E53935';
          else if (d <= 30) col = '#FB8C00';

          const label = d < 0 ? `${Math.abs(d)}d vencido` : d === 0 ? 'HOJE!' : d === 1 ? 'AMANHÃ' : `${d} dias`;
          
          let badgeBg = 'rgba(141,198,63,0.15)';
          let badgeCol = 'var(--accent-green)';
          let badgeBorder = 'rgba(141,198,63,0.3)';
          let badgeLabel = 'SAUDÁVEL';
          
          if (st === 'critical') {
            badgeBg = 'rgba(229,57,53,0.15)';
            badgeCol = '#E53935';
            badgeBorder = 'rgba(229,57,53,0.3)';
            badgeLabel = 'CRÍTICO';
          } else if (st === 'warning') {
            badgeBg = 'rgba(251,140,0,0.15)';
            badgeCol = '#FB8C00';
            badgeBorder = 'rgba(251,140,0,0.3)';
            badgeLabel = 'ATENÇÃO';
          }
          
          return (
            <div key={item.id} className="top10-item" style={{ 
              padding: '12px 16px', 
              borderBottom: '1px solid var(--border)', 
              display: 'flex', 
              flexDirection: 'column', 
              gap: '6px', 
              cursor: 'default', 
              transition: 'background 0.15s' 
            }} onMouseOver={e=>e.currentTarget.style.background='var(--bg-elevated)'} onMouseOut={e=>e.currentTarget.style.background='transparent'}>
              
              <div className="top10-row-primary" style={{ display: 'flex', alignItems: 'baseline', gap: '10px' }}>
                <span style={{ fontSize: '0.68rem', color: 'var(--text-muted)', minWidth: '20px', fontWeight: 500 }}>#{i+1}</span>
                <span className="text-2-lines" style={{ fontSize: '0.88rem', fontWeight: 600, color: 'var(--text-primary)', flex: 1 }} title={item.name}>{item.name}</span>
                <span style={{ fontSize: '0.82rem', fontWeight: 700, whiteSpace: 'nowrap', color: col }}>{label}</span>
              </div>
              
              <div className="top10-row-secondary" style={{ display: 'flex', alignItems: 'center', gap: '8px', paddingLeft: '30px' }}>
                <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)', flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.category || CATS[0]}</span>
                
                <span style={{ 
                  fontSize: '0.65rem', fontWeight: 700, padding: '2px 8px', borderRadius: '4px', whiteSpace: 'nowrap',
                  background: badgeBg, color: badgeCol, border: `1px solid ${badgeBorder}`

                  {badgeLabel}
                </span>
                
                <button 
                  onClick={() => { setActionItem(item); }}
                  style={{ 
                    fontSize: '0.72rem', padding: '3px 10px', borderRadius: '4px', border: '1px solid var(--border)', 
                    background: 'var(--bg-elevated)', color: 'var(--text-secondary)', whiteSpace: 'nowrap',
                    cursor: 'pointer', transition: 'all 0.2s'
                  }}
                  onMouseOver={e => { e.currentTarget.style.borderColor = 'var(--accent-green)'; e.currentTarget.style.color = 'var(--accent-green)'; }}
                  onMouseOut={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text-secondary)'; }}

              </div>

            </div>
          );
        })}

      </div>

      <div className="card" style={{ display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <div className="card-title" style={{ flexShrink: 0, fontSize: '0.7rem', letterSpacing: '0.1em', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '12px' }}>DISTRIBUIÇÃO POR CATEGORIA</div>
        
        <div className="scr" style={{ flex: 1, paddingRight: 0, minHeight: 0, display: 'flex', flexDirection: 'column', gap: '6px', overflowY: 'auto' }}>
        {byCat.length === 0 && <div className="empty"><div className="empty-icon">📈</div><p>Sem dados ainda.</p></div>}
        {byCat.map(([cat, v]) => {
          let borderLeftColor = 'rgba(141,198,63,0.3)';
          if (v.critical > 0) borderLeftColor = 'rgba(229,57,53,0.5)';
          else if (v.warning > 0) borderLeftColor = 'rgba(251,140,0,0.4)';

          return (
            <div key={cat} className="categoria-bloco" style={{
              background: 'var(--bg-elevated)', border: '1px solid var(--border)', borderLeft: `3px solid ${borderLeftColor}`, borderRadius: '6px', padding: '10px 12px', display: 'flex', flexDirection: 'column', gap: '6px', transition: 'border-color 0.15s'
            }} onMouseOver={e=>e.currentTarget.style.borderColor='rgba(141,198,63,0.25)'} onMouseOut={e=>e.currentTarget.style.borderColor='var(--border)'}>
              
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontSize: '0.78rem', fontWeight: 600, color: 'var(--text-primary)' }}>{cat}</span>
                <span style={{ fontSize: '0.65rem', color: 'var(--text-muted)', whiteSpace: 'nowrap' }}>{v.total} itens</span>
              </div>

              <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', alignItems: 'center' }}>
                {v.critical > 0 && (
                  <span className="status-pill" style={{ display: 'inline-flex', alignItems: 'center', gap: '4px', padding: '2px 6px', borderRadius: '4px', fontSize: '0.62rem', fontWeight: 700, whiteSpace: 'nowrap', background: 'rgba(229,57,53,0.1)', border: '1px solid rgba(229,57,53,0.25)', color: '#E53935' }}>
                    ● Crítico {v.critical}
                  </span>
                )}
                {v.warning > 0 && (
                  <span className="status-pill" style={{ display: 'inline-flex', alignItems: 'center', gap: '4px', padding: '2px 6px', borderRadius: '4px', fontSize: '0.62rem', fontWeight: 700, whiteSpace: 'nowrap', background: 'rgba(251,140,0,0.1)', border: '1px solid rgba(251,140,0,0.25)', color: '#FB8C00' }}>
                    ● Atenção {v.warning}
                  </span>
                )}
                {v.ok > 0 && (
                  <span className="status-pill" style={{ display: 'inline-flex', alignItems: 'center', gap: '4px', padding: '2px 6px', borderRadius: '4px', fontSize: '0.62rem', fontWeight: 700, whiteSpace: 'nowrap', background: 'rgba(141,198,63,0.08)', border: '1px solid rgba(141,198,63,0.2)', color: 'var(--accent-green)' }}>
                    ● Monitorar {v.ok}
                  </span>
                )}
              </div>
            </div>
          );
        })}
        </div>
      </div>

      {actionItem && (
        <div className="modal-bg no-print" onClick={() => setActionItem(null)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ textAlign:'center' }}>
            <h2 style={{ fontSize:18, fontWeight:900, marginBottom:15, color:'var(--yellow2)' }}>💡 Dica do Mané</h2>
            
            <div style={{ background: 'var(--surface2)', padding: '12px', borderRadius: '10px', marginBottom: '15px', border: '1px solid var(--border)' }}>
              <div style={{ fontSize: 14, fontWeight: 800, color: 'var(--text)' }}>{actionItem.name}</div>
              <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 4 }}>Vence em: <strong style={{ color: diffDays(actionItem.expiry) < 30 ? 'var(--red)' : 'var(--orange)' }}>{diffDays(actionItem.expiry)} dias</strong></div>
            </div>

            <div style={{ textAlign: 'left', marginBottom: 20 }}>
              <h4 style={{ fontSize: 11, fontWeight: 800, textTransform: 'uppercase', color: 'var(--muted)', marginBottom: 8 }}>Estratégias Recomendadas:</h4>
              <ul style={{ fontSize: 13, lineHeight: 1.5, color: 'var(--text2)', paddingLeft: 16, display: 'flex', flexDirection: 'column', gap: 8 }}>
                {actionItem.category === 'Farmácia' ? (
                  <>
                    <li><strong>📉 Giro Rápido:</strong> Oferecer descontos progressivos para queima de estoque.</li>
                    <li><strong>🏥 Venda Casada:</strong> Oferecer junto com consultas ou vacinas.</li>
                    <li><strong>👁️ Visibilidade:</strong> Destacar no balcão de atendimento.</li>
                  </>
                ) : actionItem.category === 'Rações de Cães' || actionItem.category === 'Rações de Gatos' ? (
                  <>
                    <li><strong>📉 Volume:</strong> Negociar o saco fechado com cliente frequente.</li>
                    <li><strong>⚖️ Granel:</strong> Abrir o saco e vender a granel (aumenta o giro).</li>
                    <li><strong>🔥 Ponto Quente:</strong> Expor na entrada da loja.</li>
                  </>
                ) : actionItem.category === 'Petiscos' ? (
                  <>
                    <li><strong>📉 Promoção:</strong> Combo "Leve 3, Pague 2".</li>
                    <li><strong>🐕 Impulso:</strong> Oferecer degustação para os pets na loja.</li>
                    <li><strong>👁️ Visibilidade:</strong> Pendurar em fitas cross próximo ao caixa.</li>
                  </>
                ) : actionItem.category === 'Higiêne e Beleza' ? (
                  <>
                    <li><strong>📉 Giro:</strong> Incluir como brinde em serviços de valor mais alto.</li>
                    <li><strong>🛁 Uso Interno:</strong> Enviar para uso no Banho & Tosa da loja.</li>
                    <li><strong>📦 Combos:</strong> Montar kit banho (Shampoo + Condicionador).</li>
                  </>
                ) : (
                  <>
                    <li><strong>📉 Liquidação:</strong> Expor em cesto de ofertas para queima rápida.</li>
                    <li><strong>📦 Combo:</strong> Fazer kits com itens complementares.</li>
                    <li><strong>🏷️ Visibilidade:</strong> Destacar com etiqueta de "Oferta Especial".</li>
                  </>
                )}
              </ul>
            </div>

            <div style={{ display:'flex', gap:10 }}>
              <button className="btn btn-ghost btn-full" onClick={() => setActionItem(null)}>Fechar</button>
            </div>
          </div>
        </div>
      )}

      {historicoModal && (
        <div className="modal-bg no-print" onClick={() => setHistoricoModal(null)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ width: '400px' }}>
            <div className="modal-title">
              {historicoModal === 'salvos' ? '✅ Produtos Salvos no Mês' : '❌ Produtos Perdidos no Mês'}
            </div>
            <div className="scr" style={{ maxHeight: '300px', display: 'flex', flexDirection: 'column', gap: '8px', marginTop: '12px' }}>
              {(historicoModal === 'salvos' ? hojeSalvos : hojePerdidos).length === 0 ? (
                <div className="empty" style={{ background: 'transparent', border: 'none' }}><p>Nenhum produto registrado neste mês.</p></div>
              ) : (
                (historicoModal === 'salvos' ? hojeSalvos : hojePerdidos).map((i, idx) => (
                  <div key={idx} style={{ padding: '8px', background: 'var(--bg-elevated)', borderRadius: '6px', border: '1px solid var(--border)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <div style={{ fontSize: '0.82rem', fontWeight: 700, color: 'var(--text-primary)' }}>{i.name}</div>
                      <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{new Date(i.data_baixa).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</div>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '4px' }}>
                      <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{i.total_qty} un. • {i.category}</div>
                      <div style={{ fontSize: '0.72rem', color: 'var(--accent-green)', fontWeight: 600 }}>Realizado por {i.usuario || 'Desconhecido'}</div>
                    </div>
                  </div>
                ))
              )}
            </div>
            <button className="btn btn-ghost btn-full" style={{ marginTop: '12px' }} onClick={() => setHistoricoModal(null)}>Fechar</button>
          </div>
        </div>
      )}

      {acaoPendente && (
        <div className="modal-bg no-print" onClick={() => setAcaoPendente(null)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ width: '320px', textAlign: 'center' }}>
            <h2 style={{ fontSize: 16, fontWeight: 800, color: acaoPendente.tipo === 'perda' ? 'var(--red)' : 'var(--green)', marginBottom: 15 }}>
              {acaoPendente.tipo === 'perda' ? 'Registrar Perda' : 'Venda Promocional'}
            </h2>
            <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginBottom: 20 }}>
              Quantas unidades de <strong>{acaoPendente.item.name}</strong>?
            </div>
            <div className="field" style={{ marginBottom: 20 }}>
              <input 
                type="number" min="1" max={acaoPendente.max} 
                value={acaoQtdDigitada} 
                onChange={e => setAcaoQtdDigitada(e.target.value)} 
                style={{ textAlign: 'center', fontSize: 24, padding: '10px', width: '100px', margin: '0 auto', display: 'block' }} 
                autoFocus 
              />
              <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 8 }}>Máximo disponível: {acaoPendente.max} un</div>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button className="btn btn-ghost btn-full" onClick={() => setAcaoPendente(null)}>Cancelar</button>
              <button className="btn btn-green btn-full" style={{ background: acaoPendente.tipo === 'perda' ? 'var(--red)' : 'var(--green)' }} onClick={confirmarAcaoOportunidade}>
                Confirmar
              </button>
            </div>
          </div>
        </div>
      )}

    
        {/* PRINT AREA (Hidden on screen, visible on print) */}
        <div className="print-only">
          <div className="print-header">
            <h1>Relatório de Oportunidades e FIFO</h1>
            <p>Agro Mané - Impresso em {new Date().toLocaleString('pt-BR')}</p>
          </div>
          <table className="print-table">
            <thead>
              <tr>
                <th style={{width: '40px', textAlign: 'center'}}>✓</th>
                <th>Produto</th>
                <th>Código (EAN)</th>
                <th>Validade</th>
                <th>Qtd</th>
                <th>Ação / Desconto</th>
              </tr>
            </thead>
            <tbody>
              {elegiveis.map(item => {
                const d = diffDays(item.expiry);
                let descPct = 0;
                if (d <= 30) descPct = 25;
                else if (d <= 60) descPct = 20;
                else if (d <= 90) descPct = 15;
                return (
                  <tr key={item.id}>
                    <td style={{textAlign: 'center'}}><div className="print-checkbox"></div></td>
                    <td><strong>{item.name}</strong></td>
                    <td>{item.id}</td>
                    <td>{fmtDate(item.expiry)}</td>
                    <td>{item.qty} un</td>
                    <td style={{fontWeight: 'bold', fontSize: '16px'}}>-{descPct}% OFF</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
</div>
  );
}

/* ── MODAL DE CONFIGURAÇÕES ── */
function ConfigModal({ config, setConfig, onClose, toast }) {
  const [token, setToken] = useState(config.telegram_token || '');
  const [chat, setChat] = useState(config.telegram_chat_id || '');
  
  const [usuarios, setUsuarios] = useState(() => {
    try { return config.usuarios ? JSON.parse(config.usuarios) : []; }
    catch(e) { return []; }
  });
  const [showAddUser, setShowAddUser] = useState(false);
  const [novoUserNome, setNovoUserNome] = useState('');
  const [novoUserSenha, setNovoUserSenha] = useState('');

  useEffect(() => {
    const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handleEsc);
    return () => window.removeEventListener('keydown', handleEsc);
  }, [onClose]);

  const save = async () => {
    await db.saveConfig('telegram_token', token.trim());
    await db.saveConfig('telegram_chat_id', chat.trim());
    setConfig({ ...config, telegram_token: token.trim(), telegram_chat_id: chat.trim() });
    toast('Configurações salvas com sucesso!');
    onClose();
  };

  const testarAlerta = async () => {
    await db.testAlert();
    toast('Comando de teste enviado ao servidor!');
  };

  const testarBackup = async () => {
    await db.testBackup();
    toast('Comando de backup enviado ao servidor!');
  };

  const exportarJSON = async () => {
    const data = await db.loadStock();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup_agromane_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    toast('Backup JSON exportado com sucesso!');
  };

  const handleImportJson = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const json = JSON.parse(ev.target.result);
        if (!Array.isArray(json)) throw new Error('O arquivo não contém um array válido.');
        const res = await db.importJson(json);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        toast(`Importados ${data.count} itens com sucesso! Atualizando...`);
        setTimeout(() => window.location.reload(), 1500);
      } catch (err) {
        alert('Erro ao importar JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="modal-bg no-print" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">⚙️ Ajustes do Sistema</div>
        <details style={{ background:'var(--surface2)', borderRadius:8, fontSize:12, color:'var(--text2)', marginBottom:15, cursor:'pointer' }}>
          <summary style={{ padding: 12, fontWeight: 700, outline: 'none', listStyle: 'none', display: 'flex', alignItems: 'center', gap: '6px' }}>
            <span style={{ fontSize: '14px' }}>❓</span> Como configurar o Bot do Telegram?
          </summary>
          <div style={{ padding: '0 12px 12px 12px', lineHeight:1.5 }}>
            <strong>1.</strong> Crie um bot no Telegram falando com o <strong>@BotFather</strong>.<br/>
            <strong>2.</strong> Cole o <strong>Token</strong> do bot abaixo.<br/>
            <strong>3.</strong> Pegue o seu <strong>Chat ID</strong> mandando mensagem para o bot <strong>@userinfobot</strong>.<br/>
            <em style={{ color: 'var(--text3)' }}>(Dica: Para grupos, adicione o bot no grupo e use o Chat ID negativo ex: -123456)</em>
          </div>
        </details>
        <div className="field" style={{ marginBottom: 12 }}><label>Bot Token</label><input value={token} onChange={e => setToken(e.target.value)} placeholder="Ex: 729183:AAH_Xx..." /></div>
        <div className="field" style={{ marginBottom: 12 }}><label>Chat ID (Destinatário)</label><input value={chat} onChange={e => setChat(e.target.value)} placeholder="Ex: 123456789" /></div>


        <div style={{ display: 'flex', gap: 10 }}>
          <button className="btn btn-yellow btn-full" onClick={save}>Salvar Configurações</button>
          <button className="btn btn-ghost btn-full" onClick={onClose}>Cancelar</button>
        </div>
        <div style={{ marginTop: 15, borderTop: '1px dashed var(--border)', paddingTop: 15 }}>
          <button className="btn btn-outline btn-full" onClick={testarAlerta} style={{ fontSize: 12 }}>🧪 Testar Alerta de Estoque Crítico Agora</button>
          <button className="btn btn-outline btn-full" onClick={testarBackup} style={{ fontSize: 12, marginTop: 8 }}>📦 Testar Envio de Backup no Telegram</button>
          
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 8 }}>
            <button className="btn btn-outline" onClick={exportarJSON} style={{ fontSize: 12, margin: 0 }}>⬇️ Exportar JSON</button>

/* ── RELATORIO SEMANAL MODAL ── */
function RelatorioSemanalModal({ stock, baixas, config, onClose }) {
  const gameMeta = parseInt(config.game_meta || '10', 10);
  
  // Calculate Monday to Friday of current week
  const today = new Date();
  const day = today.getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat
  const diffToMon = day === 0 ? -6 : 1 - day;
  
  const monday = new Date(today);
  monday.setDate(today.getDate() + diffToMon);
  monday.setHours(0,0,0,0);
  
  const friday = new Date(monday);
  friday.setDate(monday.getDate() + 4);
  friday.setHours(23,59,59,999);

  // Stats
  const usersStats = {};

  // 1. Process Baixas (Sales vs Discard)
  const baixasSemana = baixas.filter(b => {
    const d = new Date(b.data_baixa);
    return d >= monday && d <= friday;
  });
  
  baixasSemana.forEach(b => {
    const u = b.usuario || 'Desconhecido';
    if (!usersStats[u]) usersStats[u] = { salvos: 0, perdidos: 0, daysHit: 0 };
    if (b.tipo_baixa === 'venda') usersStats[u].salvos += b.quantidade;
    if (b.tipo_baixa === 'perda') usersStats[u].perdidos += b.quantidade;
  });

  // 2. Process Streaks (Mon-Fri) using Config History
  const daysArr = [0, 1, 2, 3, 4].map(offset => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + offset);
    return d.toISOString().split('T')[0];
  });

  // Init users from config
  let usuariosCadastrados = [];
  try { usuariosCadastrados = config.usuarios ? JSON.parse(config.usuarios) : []; } catch(e) {}
  usuariosCadastrados.forEach(u => {
    if (!usersStats[u.nome]) usersStats[u.nome] = { salvos: 0, perdidos: 0, daysHit: 0 };
  });

  Object.keys(usersStats).forEach(u => {
    daysArr.forEach(dt => {
      const kpiKey = `bipe_${dt}_${u}`;
      const scoreFromConfig = parseInt(config[kpiKey] || '0', 10);
      const scoreFromStock = stock.filter(i => i.ultimo_vendedor === u && i.atualizado_em && i.atualizado_em.startsWith(dt)).length;
      const finalScore = Math.max(scoreFromConfig, scoreFromStock);
      
      if (finalScore >= gameMeta) {
        usersStats[u].daysHit++;
      }
    });
  });

  const usersList = Object.entries(usersStats).sort((a, b) => b[1].daysHit - a[1].daysHit || b[1].salvos - a[1].salvos);

  return (
    <div className="modal-bg no-print" onClick={onClose} style={{ zIndex: 999 }}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ width: 450, padding: 24 }}>
        <div className="modal-title" style={{ marginBottom: 10 }}>📊 Relatório Semanal</div>
        <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 20 }}>
          Semana Atual: {monday.toLocaleDateString('pt-BR')} até {friday.toLocaleDateString('pt-BR')}
        </div>
        
        {usersList.length === 0 ? (
           <div className="empty" style={{ background: 'transparent', border: 'none' }}><p>Sem dados registrados nesta semana.</p></div>
        ) : (
          <div className="scr" style={{ maxHeight: 350, display: 'flex', flexDirection: 'column', gap: 12 }}>
            {usersList.map(([u, stat], idx) => (
              <div key={u} style={{ background: 'var(--bg-elevated)', border: '1px solid var(--border)', borderRadius: 10, padding: 16 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <div style={{ fontSize: 16, fontWeight: 800, color: 'var(--text-primary)' }}>{idx + 1}º {u}</div>
                  <div style={{ background: stat.daysHit === 5 ? 'rgba(255,87,34,0.1)' : 'var(--bg-surface)', border: stat.daysHit === 5 ? '1px solid #FF5722' : '1px solid var(--border)', padding: '4px 10px', borderRadius: 20, fontSize: 12, fontWeight: 700, color: stat.daysHit === 5 ? '#FF5722' : 'var(--text-secondary)' }}>
                    {stat.daysHit === 5 && <span style={{marginRight:5}}>🔥</span>}
                    Meta: {stat.daysHit}/5 dias
                  </div>
                </div>
                
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                  <div style={{ background: 'rgba(141,198,63,0.1)', border: '1px solid rgba(141,198,63,0.3)', borderRadius: 6, padding: 10, textAlign: 'center' }}>
                    <div style={{ fontSize: 11, color: 'var(--accent-green)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Salvos da Perda</div>
                    <div style={{ fontSize: 18, fontWeight: 900, color: 'var(--accent-green)', marginTop: 4 }}>{stat.salvos} un</div>
                  </div>
                  <div style={{ background: 'rgba(229,57,53,0.1)', border: '1px solid rgba(229,57,53,0.3)', borderRadius: 6, padding: 10, textAlign: 'center' }}>
                    <div style={{ fontSize: 11, color: 'var(--red)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Descartes (Lixo)</div>
                    <div style={{ fontSize: 18, fontWeight: 900, color: 'var(--red)', marginTop: 4 }}>{stat.perdidos} un</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
        <button className="btn btn-ghost btn-full" style={{ marginTop: 20 }} onClick={onClose}>Fechar Relatório</button>
      </div>
    </div>
  );
}

    const map = {};

    // Initialize all users
    usuariosCadastrados.forEach(u => {
      map[u.nome] = { totalHoje: parseInt(config[`bipe_${hoje}_${u.nome}`] || '0', 10), items: [] };

    stock.forEach(i => {

        map[i.ultimo_vendedor].totalHoje = Math.max(map[i.ultimo_vendedor].totalHoje, stockScans);

function App() {

  const [config,    setConfig]  = useState({});
  const [showConfig,setShowConfig] = useState(false);
  const [toastData, setToast]   = useState(null);
  const [currentUser, setCurrentUser] = useState(() => {
    try {
      const saved = localStorage.getItem('agromane_user');
      return saved ? JSON.parse(saved) : null;
    } catch(e) { return null; }
  });
  const [senha,     setSenha]   = useState('');
  const [showTodayAlert, setShowTodayAlert] = useState(false);
  const [hasCheckedToday, setHasCheckedToday] = useState(false);

  const userKPI = useMemo(() => {
    if (!currentUser) return 0;
    const hoje = new Date().toISOString().split('T')[0];
    const kpiKey = `bipe_${hoje}_${currentUser.nome}`;
    const configScore = parseInt(config[kpiKey] || '0', 10);
    const stockScore = stock.filter(i => i.ultimo_vendedor === currentUser.nome && i.atualizado_em && i.atualizado_em.startsWith(hoje)).length;
    return Math.max(configScore, stockScore);
  }, [stock, currentUser, config]);

  useEffect(() => {
    if (currentUser) {
      db.loadStock().then(setStock);
      db.loadConfig().then(setConfig);
    }
  }, [currentUser]);

  useEffect(() => {
    if (currentUser && stock.length > 0 && !hasCheckedToday) {
      const vencendoHoje = stock.filter(i => diffDays(i.expiry) <= 0);
      if (vencendoHoje.length > 0) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.type = 'square'; osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.4);
        } catch(e) {}
        setShowTodayAlert(true);
      }
      setHasCheckedToday(true);
    }
  }, [currentUser, stock, hasCheckedToday]);

  const toast   = (msg, type = 'ok') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3500) };
  const refresh = async () => setStock(await db.loadStock());

  const handleLogin = async (e) => {
    e.preventDefault();
    const conf = await db.loadConfig();
    let usuarios = [];
    try { usuarios = conf.usuarios ? JSON.parse(conf.usuarios) : []; } catch(e) {}
    if (usuarios.length === 0) {
      usuarios = [{ nome: 'Admin', senha: conf.admin_password || '4547' }];
    }
    const user = usuarios.find(u => u.senha === senha);
    if (user) {
      setCurrentUser(user);
      localStorage.setItem('agromane_user', JSON.stringify(user));
    } else {
      alert('Senha incorreta!');
    }

      await fetch(`${API_URL}/shutdown`, { method: 'POST' });

              <path d="M13 11C13 6.02944 17.0294 2 22 2C22 6.02944 17.0294 11 13 11Z" fill="var(--accent-green)" />
              <path d="M11 13C11 17.9706 6.97056 22 2 22C2 17.9706 6.02944 13 11 13Z" fill="var(--accent-green)" />
              <path d="M13 13C13 17.9706 17.0294 22 22 22C22 17.9706 17.0294 13 13 13Z" fill="var(--accent-green)" />
            </svg>
            <span style={{ color: 'var(--accent-green)', fontWeight: 700 }}>Agro Mané</span> Login
          </div>
          <div className="field" style={{ width: '100%', marginBottom: 20 }}>
            <label>Senha de Acesso</label>
            <input type="password" value={senha} onChange={e => setSenha(e.target.value)} placeholder="Senha numérica de 4 dígitos" autoFocus />
          </div>
          <button type="submit" className="btn btn-yellow btn-full">Entrar no Sistema</button>
        </form>
      </div>
    );
  }

  const gameMeta = parseInt(config.game_meta || '10', 10);
  const gameMsg = config.game_msg || 'Muito boom, de hoje ta pago. Bora vender agora';

  return (
    <div className="app">
      <Header onLogout={handleLogout} onShutdown={handleShutdown} onConfig={() => setShowConfig(true)} currentUser={currentUser} userKPI={userKPI} gameMeta={gameMeta} />
      <KpiBar stock={stock} onFilterClick={s => { setFSt(s); setTab('stock'); }} />
      <Tabs active={tab} onChange={setTab} />
      <div style={{ overflow:'hidden' }}>
        {tab === 'capture' && <CaptureTab onSave={refresh} toast={toast} stock={stock} currentUser={currentUser} gameMeta={gameMeta} gameMsg={gameMsg} config={config} setConfig={setConfig} />}
        {tab === 'receive' && <RecebimentoTab onSave={refresh} toast={toast} />}
        {tab === 'stock'   && <StockTab stock={stock} setStock={setStock} toast={toast} config={config} fSt={fSt} setFSt={setFSt} currentUser={currentUser} />}
        {tab === 'inventory' && <InventoryTab stock={stock} setStock={setStock} toast={toast} />}
        {tab === 'dash'    && <DashTab stock={stock} config={config} toast={toast} setStock={setStock} currentUser={currentUser} />}
        {tab === 'equipe'  && <EquipeTab stock={stock} config={config} setConfig={setConfig} toast={toast} />}
      </div>
      <footer className="footer">
        <span>Desenvolvido por: <strong>Matheus Henrique</strong></span>
        <span style={{ fontFamily:'Inter', fontSize:10, letterSpacing:'.1em' }}>Gestão Inteligente de Validades - Agro Mané © {new Date().getFullYear()}</span>
      </footer>
      {toastData && <Toast msg={toastData.msg} type={toastData.type} onClose={() => setToast(null)} />}
      
      {showConfig && <ConfigModal config={config} setConfig={setConfig} onClose={() => setShowConfig(false)} toast={toast} />}

      {/* Alerta de Produtos Vencendo Hoje */}
      {showTodayAlert && (
        <div className="modal-bg no-print" style={{ zIndex: 99999 }}>
          <div className="modal" style={{ textAlign:'center', border:'3px solid var(--red)' }}>
            <div style={{ fontSize:40, marginBottom:10 }}>🚨</div>
            <h2 style={{ fontSize:22, fontWeight:900, color:'var(--red)', marginBottom:10 }}>Atenção Máxima!</h2>
            <p style={{ fontSize:15, color:'var(--text2)', marginBottom:20 }}>Existem produtos no seu estoque que <strong>vencem HOJE</strong> (ou já estão vencidos). Verifique o Dashboard imediatamente!</p>
            <button className="btn btn-danger btn-full" style={{ padding:12, fontSize:16 }} onClick={() => setShowTodayAlert(false)}>Ciente, vou verificar!</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
